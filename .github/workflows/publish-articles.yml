# Publishes articles from the Google Drive "Ready to publish" folder, hourly.
# New, edited or removed Google Docs → content/articles/ → site/ rebuilt → committed → Vercel deploys the push.
# Setup (once): repository secret GDRIVE_SERVICE_ACCOUNT (the service-account JSON key) and repository
# variable DRIVE_READY_FOLDER_ID (the folder's ID). Until both exist the job does nothing and stays green.
name: Publish articles from Google Drive

on:
  schedule:
    - cron: '17 * * * *'      # every hour at :17 (UTC)
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab, to publish right away

permissions:
  contents: write

concurrency:
  group: publish-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-sync.txt

      - name: Install
        run: pip install -r scripts/requirements-sync.txt

      - name: Fetch articles from Google Drive
        id: sync
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          DRIVE_READY_FOLDER_ID: ${{ vars.DRIVE_READY_FOLDER_ID }}
        run: python scripts/sync_drive.py

      - name: Rebuild the site
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/build_standalone.py

      - name: Commit and push (Vercel deploys it)
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "J.E.I.N. publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content site
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Articles from Google Drive: ${SUMMARY}"
          git push
